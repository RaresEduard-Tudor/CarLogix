services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: carlogix-db
    environment:
      POSTGRES_DB: carlogix
      POSTGRES_USER: carlogix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - carlogix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carlogix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Backend
  carlogix-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carlogix-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carlogix
      DB_USERNAME: carlogix
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      OBD2_DB_PATH: /data/obd2_codes.db
    volumes:
      - ./obd2_codes.db:/data/obd2_codes.db:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - carlogix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # CarLogix Web Application
  carlogix-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: carlogix-web
    ports:
      - "127.0.0.1:3301:80"
    depends_on:
      carlogix-api:
        condition: service_healthy
    networks:
      - carlogix-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Development frontend (hot reload)
  carlogix-dev:
    image: node:20-alpine
    container_name: carlogix-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    command: sh -c "yarn install && yarn dev --host 0.0.0.0"
    depends_on:
      carlogix-api:
        condition: service_healthy
    networks:
      - carlogix-network
    profiles:
      - dev
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  carlogix-network:
    driver: bridge
